project_id = "sift"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/projects"]
[auth.email]
enable_signup = true
enable_confirmations = false
[storage]
enabled = true
file_size_limit = "1MiB"
[functions.extract-item]
verify_jwt = false
[functions.interpret-query]
verify_jwt = false
[functions.backfill-field]
verify_jwt = false
[functions.suggest-fields]
verify_jwt = false
[functions.edit-value]
verify_jwt = false
[functions.delete-item]
verify_jwt = false
[functions.delete-project]
verify_jwt = false
